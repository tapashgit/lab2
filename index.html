<!DOCTYPE html>
<html>
<head>
    <title>New project</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
<form>
<h1>Registration Form</h1>
<div>
<label for="fullname">Fullname:</label>
<input type="text" name="fullname" id="fullname" required>
</div><br>

<div>
<label for="password">Password:</label>
<input type="password" name="password" id="password">
</div><br>

<div>
<label for="dob">Date of birth:</label>
<input type="date" name="dob" id="dob">
</div><br>

<div>
<label for="photo">choose your photo:</label>
<input type="file" name="photo" id="photo">
</div><br>

<div>
<label for="gender">gender:</label>
<input type="radio" name="gender" id="gender1" value="Male">Male
<input type="radio" name="gender" id="gender2" value="Female">Female
</div><br>

<div>
<label for="religion">religion:</label>
<input type="checkbox" name="r1" id="r1" value="Islam">Islam
<input type="checkbox" name="r3" id="r3" value="Hindu" checked>hindu
</div><br>

<div>
<label for="department">department:</label>
<select name="department" id="department">
<option value="cse">CSE</option>
<option value="EEE" selected>EEE</option>
</select>
</div><br>

<div>
<label for="address">address:</label>
<textarea id="address" cols="25" rows="5"></textarea>
</div><br>

<div>
<input type="submit" value="register">
<input type="reset" value="clear">
</div>
<br>

</form>
</body>
</html>
